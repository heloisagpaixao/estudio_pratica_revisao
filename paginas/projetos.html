<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estúdio Tattoo - Projetos de Tatuagem</title>
  </head>
  <body>
    <h1>Projetos de Tatuagem</h1>
    <p><a href="/principal"> Voltar </a></p>
    <table border="1">
      <tr>
        <th>Modelo</th>
        <th>Cor</th>
        <th>Tamanho</th>
        <th>Lugar do Corpo</th>
        <th>Cliente</th>
        <th></th>
      </tr>
      {{#projetos}}
      <tr>
        <td>{{modelo}}</td>
        <td>{{cor}}</td>
        <td>{{tamanho}}</td>
        <td>{{lugar_do_corpo}}</td>
        <td>{{cliente_id}}</td>
        <td>
          <a href="/projetos?editar={{id}}">Editar</a>

          <form method="POST" action="/projetos/{{id}}">
            <input type="hidden" name="_method" value="DELETE" />
            <button>Excluir</button>
          </form>
        </td>
      </tr>
      {{/projetos}}
    </table>

    <h2>
      {{#editando}} Editar {{/editando}}{{^editando}} Cadastrar {{/editando}}
      projeto
    </h2>

    <form method="POST" action="{{acao}}">
      {{#editando}}<input type="hidden" name="_method" value="PUT" />
      {{/editando}}
      <select name="cliente_id" required>
        <option value="">Selecione o cliente...</option>
        {{#clientes}}
        <option value="{{id}}" {{selecionado}}>{{nome}}</option>
        {{/clientes}}
      </select>

      <input
        type="text"
        name="modelo"
        placeholder="Modelo"
        value="{{form.modelo}}"
        required
      />
      <input type="text" name="cor" placeholder="Cor" value="{{form.cor}}" />
      <input
        type="text"
        name="tamanho"
        placeholder="Tamanho"
        value="{{form.tamanho}}"
      />
      <input type="text" name="lugar_do_corpo" placeholder="Lugar do Corpo" value="{{form.lugar_do_corpo}}" />
      <button>
        {{#editando}} Salvar {{/editando}} {{^editando}} Cadastrar {{/editando}}
      </button>
    </form>
    <p>{{erro}}</p>
  </body>
</html>
